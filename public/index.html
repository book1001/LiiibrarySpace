    <div style="padding-top:10px; text-align: justify;">
      <p>Liiibrary.Space was created as a place to collect and preserve writing from across the web. It follows the spirit of the public library: knowledge should be freely accessible to everyone.</p>
      <!-- <p>Many classes and workshops introduce or share articles from the web, yet there is no public library dedicated solely to internet writing. Once a class ends, these valuable texts often become scattered and difficult to find again. Liiibrary.Space was created from the wish that there could be a place where great writing is gathered and preserved. It follows the philosophy of the public library — that knowledge should be freely accessible to everyone.</p> -->
      <!-- <p>Whether it's an article you love, something you're curious about, or writing in your own language, all are welcome here. By clicking the plus button above, anyone can add a book. Anyone can also create a local library connected to the Central Liiibrary, making it easier to discover and browse collections around a particular theme or community. Your library might collect books on a specific subject, serve as a shared reading space for your class or workshop, or simply become your own more private personal library.</p> -->
    </div>

    <div data-component="library-submit" class="main-submitField card-submit"></div>

    <div data-component="board" style="padding-bottom: 500px;"></div>
