<h1>Build Your Liiibrary</h1>

<form id="libraryForm" novalidate>

  <div class="card-item-name">
    <div>Liiibrary Name:</div>
    <!-- <div>*</div> -->
    <div class="input-container">
      <input type="text" name="libraryName" id="libraryName" required>
      <div class="input-border librarySubmit-border"></div>
    </div>
    <div></div>
    <div></div>
    <div><div id="nameStatus"></div></div>
  </div>

  <!-- <div class="card-item-required">
    <div></div>
    <div></div>
    <div><div id="nameStatus"></div></div>
  </div> -->

  <!-- <small>
    Use only letters, numbers, hyphens (-), underscores (_), and periods (.)<br>
    Periods may only appear singly between characters
  </small>
  <br><br> -->

  <div class="card-item-required">
    <div>Password:</div>
    <!-- <div>*</div> -->
    <div class="input-container">
      <input type="password" name="password" required>
      <div class="input-border librarySubmit-border"></div>
    </div>
  </div>



  <!-- <label>
    Email*
    <input type="email" name="email" placeholder="Used for password recovery">
  </label>
   -->

  <div class="card-item">
    <div>Description:</div>
    <div class="input-container">
      <input id="description" name="description" type="text" placeholder="optional">
      <div class="input-border librarySubmit-border"></div>
    </div>
    <!-- <input id="description" name="description" type="text" placeholder="Short Description (optional)"> -->
  </div>

  <div class="card-item-required">
    <div>Liiibrary Color:</div>
    <!-- <div>*</div> -->
    <div class="input-container">
      <input type="text" id="colorPicker" data-coloris autocomplete="off" spellcheck="false" value="#d35838">
      <div class="input-border librarySubmit-border"></div>
    </div>
    <!-- <label>
      <input type="text" id="colorPicker" data-coloris autocomplete="off" spellcheck="false" value="#d35838">
    </label> -->
  </div>

  <div class="card-item-radio">
    <div>Building Style:</div>
    <!-- <div>*</div> -->
    <div id="houseOptions" style="display: inline;">
      <label>
        <input type="radio" name="houseExample" value="0">Windows
      </label>
      <label>
        <input type="radio" name="houseExample" value="1">Bricks
      </label>
    </div>
  </div>


  <div>
    <div class="houseLayout">
      <div class="houseContainer">
        <textarea id="houseTextarea" rows="6" maxlength="77" spellcheck="false"></textarea>
        <div id="houseTitle" contenteditable="true" spellcheck="false"></div> 
      </div>
      <div id="houseHelp">Click to edit the building signage</div>
      <!-- <textarea id="houseTitle" rows="6" maxlength="77" spellcheck="false"></textarea> -->
    </div>

    <!-- <div id="houseTextarea" contenteditable="true" spellcheck="false"></div> -->
  </div>

  <br>

  <div class="card-item-radio">
    <div>Liiibrary Type:</div>
    <!-- <div>*</div> -->
    <div id="houseOptions" style="display: inline;">
      <label>
        <input type="radio" name="bookSharing" value="open" required>Open
      </label>
      <label>
        <input type="radio" name="bookSharing" value="private">Private
      </label>
    </div>
  </div>

  <!-- <fieldset>
    <legend>Liiibrary Type*</legend>

    <label>
      <input type="radio" name="bookSharing" value="open" required>
      Open
    </label>

    <label>
      <input type="radio" name="bookSharing" value="private">
      Private <span style="font-size: 11px; transform: translateY(110px);">❋</span>
    </label>
  </fieldset> -->

  <br>

  <!-- <button id="submitBtn" type="submit">Submit</button> -->
   <div class="card-rightBtn-container">
      <button id="librarySubmitBtn" class="submitBtn" type="submit" disabled>Submit</button>
   </div>
</form>

<p id="message"></p>
