<style>

  #closeBookCardBtn {
    position: absolute; 
    top: 20px; 
    right: 10px;
  }

  #cardNote {
    display: grid;
    grid-template-columns: 1fr;
    overflow-x: hidden;
    overflow-y: auto;
  }

  #liveNoteDate {
    font-size: 13px;
  }

  .list-item {
    display: grid;
    grid-template-columns: 85px 100px 1fr;
    column-gap: 5px;
    padding: 0;
    border-bottom: 1px solid black;
  }

  .list-item input {
    border: none;
  }

  .list-date {
    font-size: 13px;
  }

  .list-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-auto-columns: 1fr;
    grid-auto-rows: 1fr;
    gap: 0px 3px;
    grid-auto-flow: row;
  }

  .card-library-field {
    position: relative;
  }

  .bookLink {
    position: absolute;
    right: 11px;
    bottom: 3px;
    z-index: 3;
  }




  /* ==============================================
  BOOK IFRAME MODAL
  ============================================== */

  #bookIframeModal {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: none;

    background: rgba(0, 0, 0, 0.3);
  }

  #bookIframeModal.is-open {
    display: block;
  }

  .book-iframe-container {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 90vw;
    height: 90vh;

    transform: translate(-50%, -50%);

    background: white;
  }

  #bookIframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;
  }

  .book-iframe-close {
    position: absolute;

    top: 10px;
    right: 10px;

    z-index: 2;

    padding: 0;

    border: 0;

    background: transparent;

    font-size: 30px;
    line-height: 1;

    cursor: pointer;
  }
</style>

      </div>

    <div id="libraryDropdown" class="library-dropdown">
      <div id="libraryCheckboxList"></div>
    </div>
  </div>
