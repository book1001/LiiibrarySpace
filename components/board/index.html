<style>
  [data-component="board"] {
    width: 100%;
  }

  .board {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
  }

  .board-header,
  .board-form {
    display: grid;
    grid-template-columns:
      92px
      140px
      1fr
      0;
    /* grid-template-columns:
      94px
      120px
      1fr
      120px
      0; */
    /* grid-template-columns:
      94px
      minmax(100px, 0.7fr)
      minmax(260px, 2fr)
      minmax(120px, 0.7fr)
      auto; */
    column-gap: 12px;
  }

  .board-row {
    display: grid;
    grid-template-columns:
      92px
      140px
      1fr
      20px;
    /* grid-template-columns:
      94px
      minmax(100px, 0.7fr)
      1fr
      auto; */
    column-gap: 12px;
  }


  .board-header {
    padding: 8px 0;
    border-top: 3px double black;
    border-bottom: 3px double black;
    font-size: 16px;
    /* font-family: 'AmericanTypewriter'; */
    font-family: 'HB-Regular';
    font-weight: bold;
  }

  .board-form {
    align-items: stretch;
    padding: 8px 0 0 0;
    /* border-bottom: 1px solid black; */
  }

  .board-date-preview {
    display: flex;
    align-items: center;
    min-width: 0;
    white-space: nowrap;
  }

  .board-input-wrapper {
    display: flex;
    min-width: 0;
  }

  .board-input-wrapper input,
  .board-input-wrapper textarea {
    width: 100%;
    min-width: 0;
    /* min-height: 34px; */
    box-sizing: border-box;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    /* border-bottom: 2px solid black; */
  }

  .board-input-wrapper textarea {
    resize: vertical;
  }

  .board-submit-button {
    box-sizing: border-box;

    border: 1px solid currentColor;
    border-radius: 0;

    background: transparent;
    color: inherit;

    font: inherit;
    cursor: pointer;
  }

  .board-submit-button {
    display: none;
    min-height: 34px;
    padding: 6px 10px;
  }

  /* .board-submit-button:hover,
  .board-delete-button:hover {
    background: currentColor;
    color: white;
  } */

  .board-submit-button:disabled,
  .board-delete-button:disabled {
    opacity: 0.4;
    cursor: wait;
  }

  .board-status {
    display: none;
    min-height: 18px;
    padding: 5px 0;
    font-size: 12px;
  }

  .board-status[data-type="error"] {
    text-decoration: underline;
  }

  .board-list {
    width: 100%;
  }

  .board-row {
    align-items: start;
    padding: 8px 0 0 0;
    /* border-bottom: 1px solid currentColor; */
  }

  .board-row-date,
  .board-row-name,
  .board-row-message,
  .board-row-password {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .board-row-date {
    white-space: nowrap;
  }

  .board-row-message {
    white-space: pre-wrap;
  }

  .board-row-password {
    letter-spacing: 2px;
  }

  .board-delete-button {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    transform: translateY(-4px);
    font-size: 20px;
    padding: 0;
    text-align: right;
    cursor: pointer;
  }

  .board-row:hover .board-delete-button,
  .board-row.is-active .board-delete-button {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
  }

  /* .board-row:hover .board-delete-button,
  .board-row:focus-within .board-delete-button,
  .board-row:active .board-delete-button {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
  } */


  .board-empty {
    padding: 10px 0;

    border-bottom: 1px solid currentColor;
  }


  .board-password-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  .board-password-modal.is-open {
    display: flex;
  }

  .board-password-modal-inner {
    background: white;
    border: 1px solid black;
    padding: 10px;
  }

  .board-password-modal input {
    width: 200px;
    box-sizing: border-box;
    border: none;
    border-bottom: 1px solid black;
    border-radius: 0;
    background: transparent;
    font: inherit;
    outline: none;
  }

    .board-header {
      display: none;

    .board-form {

      grid-column: 2;
      grid-row: 1;
    }
  } */

  /* @media (max-width: 600px) {
    .board-form {
      grid-template-columns: 1fr;
    }

    .board-date-preview,
    .board-input-wrapper:nth-of-type(2),
    .board-input-wrapper:nth-of-type(3),
    .board-input-wrapper:nth-of-type(4),
    .board-submit-button {
      grid-column: 1;
    }
  } */
</style>

<section class="board">
  <!-- <div class="board-header">
    <div class="board-header-date">Date</div>
    <div class="board-header-name">Name</div>
    <div class="board-header-message">Message</div>
    <div class="board-header-action"></div>
  </div> -->

  <form class="board-form" data-board-form autocomplete="off">
    <div class="board-date-preview">
      <span data-board-current-date></span>
    </div>

    <div class="board-input-wrapper">
      <div class="input-container">
        <input type="text" name="name" aria-label="Name" maxlength="50" required placeholder="Name">
        <div class="input-border librarySubmit-border"></div>
      </div>
    </div>

    <div class="board-input-wrapper">
      <div class="input-container" style="width: 100%;">
        <input type="text" name="message" maxlength="200" required placeholder="Message">
        <div class="input-border librarySubmit-border"></div>
      </div>
      <!-- <textarea name="message" aria-label="Message" maxlength="2000" rows="1" required></textarea> -->
    </div>

    <!-- <div class="board-input-wrapper">
      <input type="password" name="password" aria-label="Password" maxlength="100" required>
    </div> -->

    <button class="board-submit-button" type="submit">Submit</button>
  </form>

  <div class="board-status" data-board-status aria-live="polite"></div>
  <div class="board-list" data-board-list></div>

  <template data-board-row-template>
    <article class="board-row">
      <div class="board-row-date"></div>
      <div class="board-row-name"></div>
      <div class="board-row-message"></div>
      <button type="button" class="board-delete-button material-symbols-outlined" >do_not_disturb_on</button>
    </article>
  </template>

  <template data-board-empty-template>
    <div class="board-empty">No messages yet</div>
  </template>

  <div class="board-password-modal" data-board-password-modal>
    <div class="board-password-modal-inner">
      <input
        type="password"
        data-board-password-input
        placeholder="Password"
        maxlength="100"
        autocomplete="off"
      >
    </div>
  </div>
</section>
