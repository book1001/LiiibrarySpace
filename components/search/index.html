<style>
  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    max-height: 80dvh;
    overflow-y: auto;
    background: white;
    border: 1px solid black;
    z-index: 1000;
  }

  .dropdown-menu.open {
    display: block;
  }

  .dropdown-item {
    padding: 6px 8px;
    cursor: pointer;
    font-size: 15px;
    /* overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis; */
  }

  .dropdown-item:hover {
    background: #f3f3f3;
  }

  .searchSub {
    display: block;
    font-size: 11px;
    color: #22a632;
    font-weight: bold;
  }

  #searchBar-container {
    position: relative;
  }

  #searchBtn {
    cursor: pointer;
    transform: translateY(5px);
    padding: 0;
  }

  .search-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 400px;
    overflow-y: auto;
    background: white;
    z-index: 1000;
  }

  .search-dropdown.open {
    display: block;
  }

  .search-dropdown .dropdown-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    cursor: pointer;
  }

  .search-result-type {
    flex-shrink: 0;
    font-size: 0.75rem;
    opacity: 0.5;
  }

  .search-result-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-dropdown .dropdown-item.is-selected {
    background: #eee;
  }
</style>

<div id="searchBar-container">
  <input type="text" id="searchBar" autocomplete="off" placeholder="">
  <div class="input-border searchBar-border"></div>
  <button id="searchBtn" class="material-symbols-outlined">search</button>
  <div id="searchDropdown" class="dropdown-menu search-dropdown"></div>
</div>
